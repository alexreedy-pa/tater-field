<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tater Field">
<meta name="theme-color" content="#0d0a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Tater Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0a14;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;width:100%;height:100%;max-width:calc(100vh * 16 / 10);max-height:calc(100vw * 10 / 16)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto;border-radius:6px;box-shadow:0 0 0 1px #2a2438,0 20px 60px rgba(0,0,0,.6)}
#pad{position:absolute;inset:0;touch-action:none}
.touch #thud{display:block}
#thud{display:none;position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;bottom:4%;left:4%;width:30%;max-width:170px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.03));border:2px solid rgba(255,255,255,.18);pointer-events:auto}
.stick b{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.3)}
.fire{position:absolute;bottom:6%;right:4%;width:26%;max-width:140px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c9843a,#8a4e1d);border:3px solid #f0b36b;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:3.6vmin;color:#2a160a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.fire:active{transform:translateY(2px);filter:brightness(1.1)}

.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,16,10,.52);z-index:5;padding:12px}
.menu[hidden]{display:none}
.card{width:min(94%,580px);max-height:96%;overflow:auto;background:linear-gradient(#2b3c26,#1b2919);border:2px solid #6ba84f;border-radius:16px;padding:16px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.logo{font-weight:bold;font-size:clamp(28px,7vw,52px);letter-spacing:1px;color:#ffd84a;text-shadow:0 2px 0 #7a4a12,0 0 18px rgba(255,200,60,.3)}
.sub{color:#dfe9cf;font-size:clamp(12px,2.6vw,15px);margin:4px 0 12px}
.seg{display:inline-flex;border:2px solid #6ba84f;border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{background:transparent;color:#cfe3bf;border:0;padding:8px 18px;font:bold 14px "Trebuchet MS";cursor:pointer}
.seg button.on{background:#6ba84f;color:#10210d}
.play{display:block;width:100%;max-width:300px;margin:2px auto 12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(#ffcf4a,#e9972b);color:#3a2207;font:bold 20px "Trebuchet MS";cursor:pointer;box-shadow:0 5px 0 #a86a12}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #a86a12}
.cols{display:flex;gap:12px;text-align:left;margin:2px 0 4px}
@media(max-width:460px){.cols{flex-direction:column}}
.how,.hs{flex:1;background:rgba(0,0,0,.22);border-radius:10px;padding:8px 12px}
.how div{margin:5px 0}
.how b{color:#ffd27f;font-size:11.5px;display:block}
.how span{color:#dfe9cf;font-size:12.5px}
.hsh{color:#ffd27f;font-weight:bold;font-size:12px;letter-spacing:1px;margin-bottom:6px;text-align:center}
.hs ol{margin:0;padding:0;list-style:none;counter-reset:n}
.hs li{counter-increment:n;display:flex;align-items:center;gap:6px;color:#eaf2e0;font-size:12.5px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.hs li::before{content:counter(n);color:#9fc27f;width:16px;text-align:right}
.hs li .nm{flex:1;color:#fff;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs li .bd{font-size:9px;font-weight:bold;padding:1px 5px;border-radius:6px;letter-spacing:.5px}
.bd.easy{background:#2f6f3a;color:#bfe9c4}.bd.normal{background:#3a5a86;color:#cfe0ff}.bd.hard{background:#8a2f2f;color:#ffd0d0}
.hs li .sc{color:#ffe27a;min-width:42px;text-align:right}
.hs li.me .nm{color:#ffe27a}
.foot{color:#9fb890;font-size:11.5px;margin-top:8px}
.win{color:#ffe27a;font-weight:bold;font-size:clamp(22px,5vw,34px);text-shadow:0 2px 0 #7a4a12}
.nc input{display:block;width:92%;margin:12px auto;padding:12px;border-radius:10px;border:2px solid #6ba84f;background:#13220f;color:#fff;font:bold 18px "Trebuchet MS";text-align:center}
.badmin{margin-top:8px;font-size:12px;color:#cfe3bf}
.badmin .ok{margin-bottom:5px}
.badmin .row{display:flex;gap:6px}
.badmin input{flex:1;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid #6ba84f;background:#13220f;color:#fff;font-size:11px}
.badmin button{padding:7px 12px;border:0;border-radius:8px;background:#6ba84f;color:#10210d;font-weight:bold;cursor:pointer}
.badmin .mk{background:linear-gradient(#ffcf4a,#e9972b);color:#3a2207;padding:9px 16px;font-size:14px}
.badmin .hint2{color:#9fb890;margin-top:5px}

/* touch: controls in a bar below the field */
.touch #wrap{flex-direction:column;--cb:clamp(110px,30vmin,190px)}
.touch #stage{flex:none;width:min(100vw,calc((100dvh - var(--cb) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.6));height:auto;aspect-ratio:16/10;max-width:none;max-height:none}
.touch #thud{display:flex;position:relative;inset:auto;flex:none;width:min(100vw,calc((100dvh - var(--cb) - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 1.6));height:var(--cb);align-items:center;justify-content:space-between;padding:0 5%;pointer-events:none}
.touch #thud .stick{position:relative;left:auto;bottom:auto;height:88%;width:auto;max-width:none}
.touch #thud .fire{position:relative;right:auto;bottom:auto;height:72%;width:auto;max-width:none;font-size:clamp(16px,4vmin,26px)}

/* keep thumbs on the controls from scrolling/swiping the page */
.touch #pad,.touch #thud,.touch #thud *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* phones: menus and score screens fill the whole screen and scroll; scores listed first */
.touch .menu{position:fixed;inset:0;z-index:50;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));touch-action:pan-y;background:rgba(8,16,10,.82)}
.touch .menu .card{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.touch .cols{flex-direction:column}
.touch .cols .hs{order:-1}
#hsbtn{display:none;pointer-events:auto;flex:none;align-self:center;padding:10px 14px;border:2px solid #f0b36b;border-radius:12px;background:#2b3c26;color:#ffd84a;font:bold 14px "Trebuchet MS";line-height:1.1;text-align:center;box-shadow:0 4px 0 #13220f}
.playing #hsbtn{display:block}
#hsview .hs{text-align:left}
#hsview .row2{display:flex;gap:10px;justify-content:center}
#hsview .play{margin:10px 0 0;max-width:180px;font-size:17px;padding:11px}
#hsview .alt{background:linear-gradient(#cfe3bf,#8fb37a);box-shadow:0 5px 0 #4e6b40}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="960" height="600"></canvas>
<div id="pad"></div>
<div class="menu" id="menu">
  <div class="card">
    <div class="logo">TATER FIELD</div>
    <div class="sub" id="mSub">Tater just wants to farm. The neighbors have other plans.</div>
    <div class="seg" id="seg"><button data-d="easy">Easy</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Hard</button></div>
    <button class="play" id="play">PLAY</button>
    <div class="cols">
      <div class="how" id="how"></div>
      <div class="hs"><div class="hsh" id="hsh">HIGH SCORES</div><ol id="hsl"></ol></div>
    </div>
    <div class="badmin" id="badmin"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<div class="menu" id="hsview" hidden>
  <div class="card">
    <div class="hs"><div class="hsh" id="hsh2">HIGH SCORES</div><ol id="hsl2"></ol></div>
    <div class="row2"><button class="play" id="hsresume">RESUME</button><button class="play alt" id="hsquit">QUIT GAME</button></div>
  </div>
</div>
<div class="menu" id="namecard" hidden>
  <div class="card nc">
    <div class="win">NEW HIGH SCORE!</div>
    <div class="sub" id="nScore"></div>
    <input id="nameIn" maxlength="14" placeholder="Enter your name" autocomplete="off" autocapitalize="words">
    <button class="play" id="save">SAVE</button>
  </div>
</div>
</div>
<div id="thud">
  <div class="stick" id="stick"><b id="nub"></b></div>
  <button id="hsbtn" type="button">&#127942;<br>SCORES</button>
  <div class="fire" id="fbtn">FIRE</div>
</div>
</div>
<script>
"use strict";
const CV=document.getElementById('c'),X=CV.getContext('2d'),VW=960,VH=600;
const TOUCH=matchMedia('(pointer:coarse)').matches;if(TOUCH)document.body.classList.add('touch');
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[ri(0,a.length-1)],cl=(v,a,b)=>v<a?a:v>b?b:v,TAU=Math.PI*2;
const LAWN_Y=232,GROUND_Y=258;// sky/lawn above, dirt below
const HILLS=[{x:110,r:190,c:'#78c35f'},{x:430,r:230,c:'#69b852'},{x:760,r:270,c:'#72bf5a'},{x:980,r:210,c:'#62ae4c'}];
const BIRDS=Array.from({length:6},()=>({x:rnd(0,VW),y:rnd(28,120),sp:rnd(.18,.5),ph:rnd(TAU),s:rnd(.7,1.3)}));
const BUTTERS=Array.from({length:4},()=>({x:rnd(80,VW-80),y:rnd(GROUND_Y+60,VH-70),ph:rnd(TAU),c:pick(['#ff9ed6','#ffd36b','#9ed0ff','#c89eff'])}));
const LAWN_DECOR=Array.from({length:46},()=>({x:rnd(10,VW-10),y:rnd(LAWN_Y-28,GROUND_Y-8),k:Math.random(),c:pick(['#ff6f91','#ffd93b','#ff924c','#f0f6ff','#b06bff']),ph:rnd(TAU)}));
const PEBBLES=Array.from({length:50},()=>({x:rnd(8,VW-8),y:rnd(GROUND_Y+22,VH-10),r:rnd(2,5),c:pick(['#6b4a2e','#7d5636','#5c3f28','#846043']),e:rnd(.55,.85)}));

/* ---------- audio ---------- */
let AC,MG,muted=false;
function aInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.3;MG.connect(AC.destination)}catch(e){}}
function tone(f,d,o={}){if(!AC||muted)return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain(),v=o.v??.3;os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0008,t+d);os.connect(g);g.connect(MG);os.start(t);os.stop(t+d+.03)}
function noise(d,o={}){if(!AC||muted)return;const t=AC.currentTime+(o.at||0),n=Math.max(1,(AC.sampleRate*d)|0),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.value=o.f||900;f.Q.value=o.q||1;const g=AC.createGain();g.gain.value=o.v??.3;s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d)}
function vox(kind,pm){if(!AC||muted)return;pm=pm||1;const t=AC.currentTime;
  const S={scream:{d:rnd(.6,.95),p0:560,p1:760,p2:280,f1:900,f2:1800,vib:40,vr:9,v:.32,ns:.14},
    groan:{d:rnd(.65,1),p0:140,p1:112,p2:74,f1:360,f2:760,vib:9,vr:4.2,v:.34,ns:.06},
    grunt:{d:rnd(.18,.3),p0:185,p1:140,p2:98,f1:500,f2:980,vib:8,vr:6,v:.36,ns:.1},
    oof:{d:rnd(.22,.34),p0:250,p1:290,p2:110,f1:580,f2:1120,vib:8,vr:5,v:.34,ns:.09},
    yelp:{d:rnd(.3,.5),p0:420,p1:580,p2:240,f1:760,f2:1550,vib:24,vr:7.5,v:.33,ns:.1},
    roar:{d:rnd(.5,.8),p0:120,p1:150,p2:70,f1:420,f2:900,vib:14,vr:5,v:.36,ns:.12}}[kind]||{d:.22,p0:185,p1:140,p2:100,f1:500,f2:1000,vib:8,vr:6,v:.34,ns:.1};
  const d=S.d,o=AC.createOscillator(),o2=AC.createOscillator(),sub=AC.createOscillator(),g=AC.createGain(),
    f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),ws=AC.createWaveShaper(),lfo=AC.createOscillator(),lg=AC.createGain();
  const cr=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cr[i]=Math.tanh(x*3.2)}ws.curve=cr;
  o.type='sawtooth';o2.type='sawtooth';o2.detune.value=18;sub.type='square';
  f1.type='bandpass';f1.Q.value=9;f1.frequency.value=S.f1;f2.type='bandpass';f2.Q.value=11;f2.frequency.value=S.f2;
  lfo.type='sine';lfo.frequency.value=S.vr;lg.gain.value=S.vib;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  for(const osc of [o,o2,sub]){const mul=osc===sub?.5:1;osc.frequency.setValueAtTime(S.p0*pm*mul,t);osc.frequency.linearRampToValueAtTime(S.p1*pm*mul,t+d*.22);osc.frequency.exponentialRampToValueAtTime(Math.max(36,S.p2*pm*mul),t+d)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(S.v,t+.015);g.gain.setValueAtTime(S.v,t+d*.5);g.gain.exponentialRampToValueAtTime(.001,t+d);
  const subg=AC.createGain();subg.gain.value=.5;sub.connect(subg);
  o.connect(f1);o2.connect(f1);subg.connect(f1);f1.connect(f2);f2.connect(ws);ws.connect(g);g.connect(MG);
  o.start(t);o2.start(t);sub.start(t);lfo.start(t);
  o.stop(t+d+.05);o2.stop(t+d+.05);sub.stop(t+d+.05);lfo.stop(t+d+.05);
  noise(.06,{f:1400,q:.8,v:S.ns});if(S.ns>.1)noise(d*.6,{f:S.f2,q:1,v:S.ns*.6})}

const sfx={
  shoot(){tone(220,.07,{type:'square',f2:90,v:.28});noise(.05,{f:900,q:1,v:.22})},
  dry(){tone(130,.05,{v:.12})},
  tee(){tone(2000,.03,{v:.18});noise(.05,{f:3200,q:1,v:.15})},
  dig(){tone(1200,.05,{type:'triangle',f2:1800,v:.2})},
  hurt(){tone(150,.2,{f2:50,v:.4});noise(.12,{f:260,q:1,v:.5})},
  splat(){noise(.22,{type:'lowpass',f:600,q:.6,v:.7});tone(420,.3,{type:'sawtooth',f2:90,v:.14})},
  soul(){tone(523,.12,{type:'sine',v:.12});tone(784,.14,{type:'sine',at:.1,v:.12});tone(1047,.3,{type:'sine',at:.22,v:.1})},
  wave(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,{at:i*.09,v:.18,type:'triangle'}))},
  boss(){[196,185,175].forEach((f,i)=>tone(f,.4,{at:i*.18,type:'sawtooth',v:.25}))},
  die(){[[330,0],[330,.18],[311,.36],[294,.54]].forEach(([f,a])=>tone(f,.4,{at:a,type:'sawtooth',v:.2}))},
  bonus(){[659,784,988,1319].forEach((f,i)=>tone(f,.12,{at:i*.07,v:.18}))},
  horn(){tone(185,.22,{type:'square',v:.2});tone(150,.3,{type:'square',at:.1,v:.2});noise(.3,{f:120,q:.6,v:.1})},
  secret(){[784,1047,1319,1568].forEach((f,i)=>tone(f,.14,{at:i*.05,type:'sine',v:.13}))}
};
const YELLS=['Ugh!','Oh come on, man!','Gee willikers!','Gosh dang!','Dang gum!'];
const CRIES=['AAAGH!','UGHHH!','OOF!','NNGH!','GAAH!','ARGH!','HRRK!','WAAUGH!'];
let voices=[],prefVoices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];const sc=v=>{const n=(v.name||'').toLowerCase();let s=0;if(/en[-_]?us/i.test(v.lang))s+=2;else if(/^en/i.test(v.lang))s+=1;if(/natural|neural|premium|enhanced|google|samantha|daniel|aaron|matthew|guy|jenny|eric|ava|tom/.test(n))s+=4;if(v.localService===false)s+=1;if(/zira|david|mark|microsoft/.test(n))s+=1;return s};prefVoices=voices.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>sc(b)-sc(a))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function yell(){}

/* ---------- input ---------- */
const keys=new Set();let fireHeld=false;
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')fireHeld=true;if(e.key==='Enter'&&(G.mode==='title'||G.mode==='over')){playEl.click();}if(e.key==='p'||e.key==='P')togglePause();if(e.key==='m'||e.key==='M'){muted=!muted;if(muted)try{speechSynthesis.cancel()}catch(x){}}aInit();});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key===' ')fireHeld=false});
addEventListener('blur',()=>{keys.clear();fireHeld=false});
CV.addEventListener('pointerdown',()=>{aInit()});
function togglePause(){if(G.mode==='play')G.mode='pause';else if(G.mode==='pause')G.mode='play'}
// touch stick + fire
let stickVec={x:0,y:0},stickId=null;
const stick=document.getElementById('stick'),nub=document.getElementById('nub'),fbtn=document.getElementById('fbtn');
if(TOUCH){
  const thudEl=document.getElementById('thud');
  ['touchstart','touchmove','touchend','gesturestart'].forEach(t=>thudEl.addEventListener(t,e=>{if(e.cancelable)e.preventDefault()},{passive:false}));
  document.addEventListener('touchmove',e=>{if(G.mode==='play'&&e.cancelable&&!(e.target&&e.target.closest&&e.target.closest('input,.menu')))e.preventDefault()},{passive:false});
  const sr=()=>stick.getBoundingClientRect();
  const mv=e=>{const r=sr(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,R=r.width/2,m=Math.hypot(dx,dy)||1,k=Math.min(1,m/R);stickVec={x:dx/m*k,y:dy/m*k};nub.style.transform=`translate(${dx/m*k*R*.55}px,${dy/m*k*R*.55}px)`};
  stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);aInit();mv(e)});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)mv(e)});
  const end=e=>{if(e.pointerId===stickId){stickId=null;stickVec={x:0,y:0};nub.style.transform=''}};
  stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
  fbtn.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;aInit()});
  const fend=e=>{e.preventDefault();fireHeld=false};
  fbtn.addEventListener('pointerup',fend);fbtn.addEventListener('pointercancel',fend);
}

/* ---------- state ---------- */
const G={mode:'title',t:0,shake:0,flash:0,flashCol:'#fff',freeze:0,best:load('tater_best',0),plays:load('tater_plays',0),diff:'normal',bossKind:null,lastName:'',lastDiff:'',over:null,secretOn:false};
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:+v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const DIFF={
 easy:{label:'Easy',lives:4,ball:.82,spawn:1.3,rigMax:1,rigGap:[11,16],rigSpd:1.7,rigSeek:0,waveQ:0,fatHp:9},
 normal:{label:'Normal',lives:3,ball:1,spawn:1,rigMax:2,rigGap:[7,11],rigSpd:2.4,rigSeek:.12,waveQ:1,fatHp:12},

  // lawn

  X.fillStyle='#45a046';for(let x=0;x<VW;x+=14)X.fillRect(x,LAWN_Y-34,2,GROUND_Y-LAWN_Y+34);
  for(const f of LAWN_DECOR)flower(f);

  X.strokeStyle='#d8e9ee';X.lineWidth=3;X.beginPath();X.moveTo(0,GROUND_Y-2);X.lineTo(VW,GROUND_Y-2);X.stroke();
  X.fillStyle='#e7f3f6';for(let x=8;x<VW;x+=46){X.fillRect(x,GROUND_Y-16,6,16)}

  for(const pb of PEBBLES)pebble(pb);

  // entities sorted by y

  for(const n of neigh)ents.push({y:n.y,f:()=>neighbor(n)});

  ents.sort((a,b)=>a.y-b.y);for(const e of ents)e.f();
  if(P.dead)ragen();
  // projectiles

  for(const s of spuds)spud(s);
  // particles

  for(const s of souls){const a=cl(1-s.t/120,0,1);X.globalAlpha=a*.85;X.font='24px serif';X.textAlign='center';X.fillStyle='#fff';X.fillText('ᗢ',s.x,s.y);X.globalAlpha=a;X.font='bold 11px Trebuchet MS';X.fillStyle='#eaf2ff';X.fillText('♪',s.x+14,s.y-6);X.globalAlpha=1}

function plant(pl){const{x,y,ripe,g}=pl;X.strokeStyle=ripe?'#4bd06a':'#3f8a3f';X.lineWidth=3;X.beginPath();X.moveTo(x,y);X.lineTo(x,y-14);X.stroke();
  for(let i=0;i<3;i++){const a=-Math.PI/2+(i-1)*.7;X.beginPath();X.moveTo(x,y-8);X.lineTo(x+Math.cos(a)*11,y-8+Math.sin(a)*11);X.stroke()}
  if(ripe){const fl=Math.sin(G.t*.1+g)*2;X.fillStyle='#ffe66b';X.beginPath();X.arc(x,y-16+fl,4,0,TAU);X.fill();X.fillStyle='rgba(255,230,107,.3)';X.beginPath();X.arc(x,y-16+fl,8,0,TAU);X.fill()}
  X.fillStyle='#6b4423';X.beginPath();X.ellipse(x,y+2,10,4,0,0,TAU);X.fill()}
function bloodStain(st){X.save();X.translate(st.x,st.y);X.globalAlpha=.82*st.max;X.fillStyle='#6e0d0d';X.beginPath();X.ellipse(0,0,st.r*st.max,st.r*.42*st.max,0,0,TAU);X.fill();X.fillStyle='#9c1212';for(const d of st.drips){X.beginPath();X.arc(Math.cos(d.a)*d.d*st.max,Math.sin(d.a)*d.d*.45*st.max,d.r*st.max,0,TAU);X.fill()}X.globalAlpha=1;X.restore()}
function tomb(x,y,s){X.save();X.translate(x,y);X.scale(s,s);X.fillStyle='rgba(0,0,0,.2)';X.beginPath();X.ellipse(0,6,16,5,0,0,TAU);X.fill();X.fillStyle='#b9bfc6';X.beginPath();X.moveTo(-12,6);X.lineTo(-12,-10);X.arc(0,-10,12,Math.PI,0);X.lineTo(12,6);X.closePath();X.fill();X.fillStyle='#8c939b';X.font='bold 10px Trebuchet MS';X.textAlign='center';X.fillText('RIP',0,-4);X.restore()}

function ragen(){
  const x=P.x,y=P.y,bob=Math.sin(P.walk*3)*2+(P.moving?0:Math.sin(G.t*.08)*1.1),inv=P.inv>0&&((G.t*0.5|0)%2);
  if(inv&&G.mode==='play'&&!P.dead){}
  X.save();X.translate(x,y);
  if(P.dead){const T=P.dt||(P.dt=0);}
  X.globalAlpha=inv?.4:1;
  // shadow
  X.globalAlpha*= 1;X.fillStyle='rgba(0,0,0,.22)';X.beginPath();X.ellipse(0,24,20,6,0,0,TAU);X.fill();
  if(inSafe()){const pr=26+Math.sin(G.t*.2)*4,gg=X.createRadialGradient(0,-4,4,0,-4,pr);gg.addColorStop(0,'rgba(255,226,122,.35)');gg.addColorStop(1,'rgba(255,226,122,0)');X.fillStyle=gg;X.beginPath();X.arc(0,-4,pr,0,TAU);X.fill();X.fillStyle='rgba(255,240,180,'+(0.5+0.4*Math.sin(G.t*.3))+')';X.font='12px Trebuchet MS';X.textAlign='center';X.fillText('✦',10,-34)}
  const f=P.face||1;
  // legs
  X.strokeStyle='#3b5ba0';X.lineWidth=6;X.lineCap='round';const ls=Math.sin(P.walk*3)*5;
  X.beginPath();X.moveTo(-6,10);X.lineTo(-6-ls,24);X.moveTo(6,10);X.lineTo(6+ls,24);X.stroke();
  // body (overalls)
  X.fillStyle='#4f74c9';roundRect(-13,-10+bob,26,24,7);X.fill();
  X.fillStyle='#6b4a8f';X.fillRect(-13,-2+bob,26,6);// shirt under
  X.fillStyle='#4f74c9';X.fillRect(-13,-10+bob,26,10);
  // straps
  X.strokeStyle='#3b5bb0';X.lineWidth=3;X.beginPath();X.moveTo(-7,-10+bob);X.lineTo(-5,2+bob);X.moveTo(7,-10+bob);X.lineTo(5,2+bob);X.stroke();
  // arms holding gun
  X.strokeStyle='#e6b48a';X.lineWidth=5;X.beginPath();X.moveTo(-10,-4+bob);X.lineTo(-18*0+ -2,-6+bob);X.stroke();
  // potato gatling gun
  const rec=P.muz>0?2.2:0;
  X.save();X.translate(f*(8-rec),-2+bob);X.scale(f,1);
  const spin=P.gunSpin||0,NB=5,BR=5.2;
  X.fillStyle='#34393f';X.beginPath();X.arc(0,0,9.5,0,TAU);X.fill();// rear housing
  // rotating barrels (back half)
  const order=[];for(let i=0;i<NB;i++)order.push({yo:Math.cos(spin+i/NB*TAU)*BR,z:Math.sin(spin+i/NB*TAU)});order.sort((a,b)=>a.z-b.z);
  for(const o of order){const lt=90+o.z*70;X.fillStyle='rgb('+(lt*.5|0)+','+(lt*.56|0)+','+(lt*.62|0)+')';roundRect(2,o.yo-2.3,25,4.6,2);X.fill();X.fillStyle='rgba(255,255,255,.18)';X.fillRect(26,o.yo-2,3,4)}
  X.fillStyle='#565c63';X.beginPath();X.arc(0,0,6,0,TAU);X.fill();// front hub
  X.fillStyle='#2a2e33';X.fillRect(-2,-2,4,4);
  X.strokeStyle='#5a3a2a';X.lineWidth=4;X.lineCap='round';X.beginPath();X.moveTo(-3,6);X.lineTo(-7,17);X.stroke();// handle
  if(P.muz>0){const my=Math.cos(spin)*BR;X.fillStyle='#ffdf8a';X.beginPath();X.arc(30,my,9+rnd(0,6),0,TAU);X.fill();X.fillStyle='#fff6d8';X.beginPath();X.arc(29,my,4.5,0,TAU);X.fill();X.fillStyle='rgba(255,180,90,.5)';X.beginPath();X.arc(34,my,4,0,TAU);X.fill()}
  X.restore();
  // head
  X.fillStyle='#e6b48a';X.beginPath();X.arc(0,-20+bob,10,0,TAU);X.fill();
  // straw hat
  X.fillStyle='#d9b45a';X.beginPath();X.ellipse(0,-26+bob,15,4,0,0,TAU);X.fill();X.beginPath();X.ellipse(0,-30+bob,8,7,0,0,TAU);X.fill();
  X.fillStyle='#b9933f';X.fillRect(-8,-27+bob,16,2);
  // face
  X.fillStyle='#222';X.beginPath();X.arc(f*3,-21+bob,1.6,0,TAU);X.fill();
  X.strokeStyle='#a06a3a';X.lineWidth=2;X.beginPath();X.arc(f*2,-16+bob,4,.1,Math.PI-.1);X.stroke();
  X.restore();X.globalAlpha=1;
  if(P.bonk>0){X.font='bold 20px Trebuchet MS';X.textAlign='center';X.fillStyle='#ff6a6a';X.fillText('✶',x-16,y-30);X.fillText('✶',x+16,y-34)}
}
function neighbor(n){
  if(n.dead)return;
  if(n.kind==='fat'){drawFat(n);return}
  const x=n.x,y=n.y,hurt=n.hurt>0&&((G.t*0.6|0)%2),toP=Math.sign(P.x-x)||1;
  let lean;
  if(n.st==='windup')lean=-0.30*toP*cl((16-n.t)/16+.35,0,1);
  else if(n.st==='swing')lean=0.52*toP*cl(n.swing/8,0,1);
  else lean=Math.sin(G.t*.05+n.ph)*0.05;
  const bob=n.moving?Math.abs(Math.sin(G.t*.22+n.ph))*2:Math.sin(G.t*.06+n.ph)*1.1;
  const ls=n.moving?Math.sin(G.t*.22+n.ph)*5:Math.sin(G.t*.06+n.ph)*1;
  const main=hurt?'#ffffff':n.col[0],dark=hurt?'#ffd0d0':n.col[1],skin='#e9c6a0';
  X.save();X.translate(x,y);
  X.fillStyle='rgba(0,0,0,.2)';X.beginPath();X.ellipse(0,26,16,5,0,0,TAU);X.fill();
  X.translate(0,bob);X.rotate(lean);
  // legs
  X.strokeStyle='#d8cbae';X.lineWidth=6;X.lineCap='round';X.beginPath();X.moveTo(-5,12);X.lineTo(-6-ls,26-Math.abs(ls)*.4);X.moveTo(5,12);X.lineTo(6+ls,26-Math.abs(ls)*.4);X.stroke();
  // body (polo)
  X.fillStyle=main;roundRect(-12,-8,24,22,6);X.fill();
  X.fillStyle=dark;X.fillRect(-12,-8,24,5);
  X.fillStyle=dark;X.beginPath();X.moveTo(-5,-8);X.lineTo(0,-3);X.lineTo(5,-8);X.closePath();X.fill();
  // bobbing head
  const hn=Math.sin(G.t*.1+n.ph)*1.4;
  X.save();X.translate(toP*1.4,hn);
  X.fillStyle=skin;X.beginPath();X.arc(0,-18,9,0,TAU);X.fill();
  if(n.boss){X.fillStyle='#d4af37';X.beginPath();X.arc(0,-22,10,Math.PI,0);X.fill();X.fillRect(-10,-22,20,3);
    X.fillStyle='#ffe27a';X.beginPath();X.moveTo(-8,-28);X.lineTo(-8,-34);X.lineTo(-3,-30);X.lineTo(0,-36);X.lineTo(3,-30);X.lineTo(8,-34);X.lineTo(8,-28);X.closePath();X.fill();}
  else{X.fillStyle=dark;X.beginPath();X.arc(0,-20,9,Math.PI,0);X.fill();X.fillStyle=dark;X.fillRect(toP>0?0:-14,-20,14,3)}
  X.fillStyle='#222';X.beginPath();X.arc(toP*3,-18,1.5,0,TAU);X.fill();
  X.restore();
  // arm + golf club
  let ang;
  if(n.st==='windup')ang=(toP>0?-2.4:-Math.PI+2.4)+Math.sin(G.t*.3)*0.06;
  else if(n.st==='swing')ang=toP>0?.8:Math.PI-.8;
  else ang=(toP>0?-.5:Math.PI+.5)+Math.sin(G.t*.09+n.ph)*0.12;
  const hx=toP*7,hy=-2,ex=hx+Math.cos(ang)*22,ey=hy+Math.sin(ang)*22;
  X.strokeStyle=skin;X.lineWidth=4;X.lineCap='round';X.beginPath();X.moveTo(toP*6,-2);X.lineTo(hx,hy);X.stroke();
  X.strokeStyle='#888';X.lineWidth=3;X.beginPath();X.moveTo(hx,hy);X.lineTo(ex,ey);X.stroke();
  X.fillStyle='#ccc';X.beginPath();X.ellipse(ex,ey,4,2.5,ang,0,TAU);X.fill();
  X.restore();
  if(n.st==='windup'){const fp=1+Math.sin(G.t*.4)*.08;X.save();X.translate(x,y-34);X.scale(fp,fp);X.font='bold 14px Trebuchet MS';X.textAlign='center';X.lineWidth=3;X.strokeStyle='#2a6a2a';X.strokeText('FORE!',0,0);X.fillStyle='#fff';X.fillText('FORE!',0,0);X.restore()}
  if(n.boss){X.fillStyle='#ffe9a8';X.font='bold 10px Trebuchet MS';X.textAlign='center';X.fillText('HP '+n.hp,x,y-42+bob)}
}
function golfball(b){X.save();X.translate(b.x,b.y);X.fillStyle='rgba(0,0,0,.15)';X.beginPath();X.arc(1,2,6,0,TAU);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(0,0,6,0,TAU);X.fill();X.fillStyle='#d6d9de';for(let i=0;i<4;i++){const a=b.spin+i*1.57;X.beginPath();X.arc(Math.cos(a)*2.5,Math.sin(a)*2.5,1,0,TAU);X.fill()}X.restore()}
function spud(s){X.save();X.translate(s.x,s.y);X.rotate(s.spin);X.fillStyle='rgba(0,0,0,.12)';X.beginPath();X.ellipse(1,2,8,6,0,0,TAU);X.fill();X.fillStyle='#c79a56';X.beginPath();X.ellipse(0,0,8,6,0,0,TAU);X.fill();X.fillStyle='#a87c3c';for(let i=0;i<3;i++)X.fillRect(-4+i*3,-2+((i%2)*2),1.5,1.5);X.strokeStyle='rgba(255,240,200,.5)';X.lineWidth=1.5;X.beginPath();X.arc(-2,-2,3,-1,1);X.stroke();X.restore()}
function particle(p){X.globalAlpha=p.k==='goo'?cl(p.life/30,0,1):cl(p.life/20,0,1);
  if(p.k==='limb'){X.save();X.translate(p.x,p.y);X.rotate(p.rot+=p.vr||0);X.fillStyle=p.c;roundRect(-p.r,-p.r*.5,p.r*2,p.r,2);X.fill();X.restore()}
  else if(p.k==='dust'){X.globalAlpha=cl(p.life/26,0,1)*.45;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r+(26-p.life)*.18,0,TAU);X.fill()}
  else{X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,TAU);X.fill()}
  X.globalAlpha=1}
function roundRect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}

function hud(){
  X.textAlign='left';X.font='bold 20px Trebuchet MS';
  // score pill
  panel(12,12,196,34);X.fillStyle='#ffe9a8';X.fillText('SCORE',22,35);X.fillStyle='#fff';X.textAlign='right';X.fillText(String(score).padStart(6,'0'),200,35);
  // wave
  X.textAlign='left';panel(VW/2-70,12,140,34);X.fillStyle='#ffd27f';X.textAlign='center';X.fillText('WAVE '+wave,VW/2,35);
  // lives
  X.textAlign='right';panel(VW-208,12,196,34);
  X.textAlign='left';for(let i=0;i<5;i++){X.font='18px Trebuchet MS';X.globalAlpha=i<P.lives?1:.25;X.fillText('🥔',VW-200+i*22,35)}X.globalAlpha=1;
  // ammo bar
  X.font='bold 14px Trebuchet MS';X.fillStyle='#fff';X.textAlign='right';
  const aw=150,ax=VW-aw-12,ay=54;panel(ax-6,ay-2,aw+12,20);
  X.fillStyle='#caa15a';for(let i=0;i<40;i++)X.fillRect(ax+i*(aw/40),ay,aw/40-1,16);
  X.fillStyle='#fff';X.fillText('POTATOES \u221E',ax-12,ay+14);
}
function panel(x,y,w,h){X.fillStyle='rgba(20,14,28,.55)';roundRect(x,y,w,h,8);X.fill();X.strokeStyle='rgba(255,255,255,.15)';X.lineWidth=1;X.stroke()}
function drawBanner(){const a=cl(banner.t/40,0,1)*cl((150-banner.t)/20,0,1);X.globalAlpha=Math.min(1,a+ (banner.t>40?1:a));X.globalAlpha=cl(Math.min(banner.t,150-banner.t)/20,0,1);
  X.fillStyle='rgba(20,14,28,.72)';roundRect(VW/2-230,VH/2-70,460,banner.bonus?130:104,14);X.fill();X.strokeStyle='#ffd27f';X.lineWidth=2;X.stroke();
  X.textAlign='center';X.fillStyle='#ffe9a8';X.font='bold 44px Trebuchet MS';X.fillText(banner.big,VW/2,VH/2-16);
  X.fillStyle='#fff';X.font='18px Trebuchet MS';X.fillText(banner.sub,VW/2,VH/2+16);
  if(banner.bonus){X.fillStyle='#7dffa0';X.font='bold 18px Trebuchet MS';X.fillText('Wave bonus +'+banner.bonus+'   •   Extra life!',VW/2,VH/2+46)}
  X.globalAlpha=1}

  lines.forEach((l,i)=>{X.fillStyle='#ffd27f';X.font='bold 16px Trebuchet MS';X.fillText(l[0],VW/2-215,290+i*26);X.fillStyle='#eee';X.font='16px Trebuchet MS';X.fillText(l[1],VW/2-90,290+i*26)});
  X.textAlign='center';X.fillStyle='#fff';X.font='bold 26px Trebuchet MS';const pulse=.6+.4*Math.sin(G.t*.08);X.globalAlpha=pulse;X.fillText(TOUCH?'TAP TO START':'PRESS ENTER TO START',VW/2,450);X.globalAlpha=1;
  X.font='15px Trebuchet MS';X.fillStyle='#bdb6c8';X.fillText('Best: '+G.best+'      Games played on this device: '+G.plays,VW/2,500);

}
function box2(x,y,w,h){X.fillStyle='rgba(20,14,28,.6)';roundRect(x,y,w,h,12);X.fill();X.strokeStyle='rgba(255,210,127,.5)';X.lineWidth=2;X.stroke()}

  else{X.fillStyle='#bdb6c8';X.font='17px Trebuchet MS';X.fillText('Best: '+G.best,VW/2,366)}
  X.fillStyle='#fff';X.font='bold 24px Trebuchet MS';X.globalAlpha=.6+.4*Math.sin(G.t*.08);X.fillText(TOUCH?'TAP TO PLAY AGAIN':'PRESS ENTER TO PLAY AGAIN',VW/2,440);X.globalAlpha=1;
}
function overlay(t,s){X.fillStyle='rgba(13,10,20,.55)';X.fillRect(0,0,VW,VH);X.textAlign='center';X.fillStyle='#fff';X.font='bold 56px Trebuchet MS';X.fillText(t,VW/2,VH/2-10);X.font='20px Trebuchet MS';X.fillStyle='#ffd27f';X.fillText(s,VW/2,VH/2+34)}

reset();showMenu('title');initDB();
requestAnimationFrame(frame);
/* high scores reachable any time: SCORES button pauses and shows the list */
(function(){const v=$('hsview'),b=$('hsbtn');let last=0;
  function open(){if(G.mode!=='play'&&G.mode!=='pause')return;G.mode='pause';fill();v.hidden=false;
    if(netReady)netLoad().then(r=>{if(r){globalHS=r;if(!v.hidden)fill()}})}
  function fill(){renderHS();$('hsl2').innerHTML=hslEl.innerHTML;$('hsh2').textContent=$('hsh').textContent}
  function tap(f){return e=>{e.preventDefault();e.stopPropagation();const t=Date.now();if(t-last<400)return;last=t;f()}}
  ['touchend','click'].forEach(ev=>b.addEventListener(ev,tap(open),{passive:false}));
  b.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  $('hsresume').onclick=()=>{v.hidden=true;if(G.mode==='pause')G.mode='play'};
  $('hsquit').onclick=()=>{v.hidden=true;G.lastDiff=G.diff;showMenu('over')};
  addEventListener('keydown',e=>{if((e.key==='h'||e.key==='H')&&!(e.target&&e.target.tagName==='INPUT'))v.hidden?open():$('hsresume').click()});
  setInterval(()=>{document.body.classList.toggle('playing',G.mode==='play'||G.mode==='pause');if(!v.hidden&&G.mode!=='pause')v.hidden=true},250)})();
/* full screen when sideways (Android/iPad; iPhone Safari needs Add to Home Screen) */
(function(){const de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;if(!req)return;
  const isLand=()=>matchMedia('(orientation: landscape)').matches,isFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const go=()=>{if(TOUCH&&isLand()&&!isFS()){try{const p=req.call(de,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{})}catch(e){}}};
  addEventListener('pointerdown',go,true);addEventListener('orientationchange',()=>setTimeout(go,300));
  try{screen.orientation&&screen.orientation.addEventListener('change',go)}catch(e){}})();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
